# Evidence-only baseline; changing this list is a reviewed policy decision.
# SPDX expression evaluation belongs to cargo-deny, not a home-grown parser.
[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
  "CDLA-Permissive-2.0", "GPL-3.0-only", "ISC", "MIT", "Unicode-3.0",
  "Unlicense", "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
