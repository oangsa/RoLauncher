[package]
name = "rolauncher-desktop"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native GPUI desktop shell for RoLauncher"

[features]
default = []
ui-smoke = []

[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d3fc053d5b62386247b15f069871eabe817032ab", default-features = false }
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "d3fc053d5b62386247b15f069871eabe817032ab", default-features = false }
image = "0.25"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
