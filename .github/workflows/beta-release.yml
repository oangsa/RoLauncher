name: Beta release

on:
  push:
    tags: ['beta-v*']

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-checks:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.99.0
      - name: Check version and release notes
        run: python scripts/check-release.py
      - name: Rust, desktop and GPUI smoke tests
        run: ./scripts/test.ps1
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Test isolated installer and update handoff
        run: ./scripts/test-installer.ps1
      - name: Package executable installer, portable app and corresponding source
        run: ./scripts/package.ps1 -UseCurrentVersion
      - name: Verify packaged files and published desktop
        run: python scripts/verify-package.py --smoke-shell
      - uses: actions/upload-artifact@v4
        with:
          name: beta-windows-attempt-${{ github.run_attempt }}
          path: |
            dist/rolauncher-v*-setup-x64.exe
            dist/rolauncher-v*-windows-x64.zip
            dist/rolauncher-v*-source.zip
            dist/rolauncher-v*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: beta-windows-diagnostics
          path: |
            target/ui-preview/*.txt
            target/ui-preview/*.png
            target/ui-bridge/*.txt

