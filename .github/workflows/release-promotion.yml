name: Protected release promotion

on:
  workflow_run:
    workflows: [CI and release, Linux development port, Beta release]
    types: [completed]

permissions:
  contents: read

# Serialize stable and beta publication, including interrupted-run reconciliation.
concurrency:
  group: protected-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify authority and promote
    if: >-
      vars.RELEASE_PROMOTION_ENABLED == 'true' &&
      github.repository == 'oangsa/RoLauncher' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.name == 'Beta release')
    runs-on: ubuntu-24.04
    # Two attended gates (20 minutes each), admission, staging and reconciliation.
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    steps:
      # workflow_run's github.sha is the trusted default-branch revision, never head_sha.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only admission and preflight challenge
        id: admission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROMOTION_ENABLED: ${{ vars.RELEASE_PROMOTION_ENABLED }}
        run: python3 scripts/release_promotion.py --stage prepare
      - name: Publish preflight challenge artifact
        if: steps.admission.outputs.admitted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-challenge-${{ github.run_id }}-${{ github.run_attempt }}-preflight
          path: owner-evidence/preflight/challenge.json
          if-no-files-found: error
          retention-days: 7
      - name: Attend preflight, stage verified assets and request final evidence
        if: steps.admission.outputs.admitted == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROMOTION_ENABLED: ${{ vars.RELEASE_PROMOTION_ENABLED }}
        run: python3 scripts/release_promotion.py --stage stage
      - name: Publish final challenge artifact
        if: steps.admission.outputs.admitted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-challenge-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: owner-evidence/final/challenge.json
          if-no-files-found: error
          retention-days: 7
      - name: Attend final, reverify and publish or reconcile immutable receipt
        if: steps.admission.outputs.admitted == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROMOTION_ENABLED: ${{ vars.RELEASE_PROMOTION_ENABLED }}
        run: python3 scripts/release_promotion.py --stage finish
      - name: Preserve challenge and acceptance audit
        if: always() && steps.admission.outputs.admitted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-evidence-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: owner-evidence/
          if-no-files-found: error
          retention-days: 30
