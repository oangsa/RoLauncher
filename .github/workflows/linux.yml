name: Linux development port

on:
  push:
    branches: [main, dev, 'feature/**', 'codex/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-checks:
    name: Linux checks (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu
            container: ubuntu:24.04
          - distro: Arch
            container: archlinux:base-devel
    container: ${{ matrix.container }}
    steps:
      - name: Install build and fixture dependencies
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libdbus-1-dev curl git python3 libicu74 libssl3 zlib1g libfontconfig1 libx11-6 libxrandr2 libxi6 libgl1 xvfb xauth fonts-dejavu-core
          else
            pacman -Syu --noconfirm --needed base-devel pkgconf dbus curl git python icu openssl zlib fontconfig libx11 libxrandr libxi mesa xorg-server-xvfb xorg-xauth ttf-dejavu
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install pinned Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.0 --profile minimal --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Rust, credential, API and archive tests
        shell: bash
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check
          python3 scripts/check-release.py
          python3 scripts/test-linux-update.py
          python3 scripts/test-sober-isolation-adapter.py
          dotnet restore desktop.tests/RoLauncher.Desktop.Tests.csproj --locked-mode --configfile desktop/NuGet.Config
          dotnet run --project desktop.tests --no-restore -c Release
      - name: Build and render isolated Linux shell
        shell: bash
        run: |
          cd desktop.linux
          dotnet restore --locked-mode -p:Configuration=Release --configfile NuGet.Config
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("../Cargo.toml", "rb"))["package"]["version"])')"
          dotnet publish --no-restore -c Release -p:Version="$version" -p:UiSmoke=true -o ../target/linux-ui-smoke
          cd ..
          xvfb-run -a -s '-screen 0 1280x1024x24' python3 scripts/ui-smoke-linux.py --shell target/linux-ui-smoke/RoLauncher.Desktop
      - name: Package normal Linux shell
        shell: bash
        run: |
          bash scripts/build-linux.sh
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          python3 scripts/package-linux.py --directory "target/linux/rolauncher-v$version"
          xvfb-run -a -s '-screen 0 1280x1024x24' python3 scripts/verify-linux-package.py --directory "target/linux/rolauncher-v$version" --smoke-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.distro }}-preview
          path: |
            target/linux-ui-preview/*.png
            target/linux-ui-preview/*.txt
            dist/rolauncher-v*-linux-x64.tar.gz
            dist/rolauncher-v*-linux-SHA256SUMS.txt
          if-no-files-found: warn

# This workflow validates a development preview, not the GNOME/KDE parity matrix.
# It deliberately does not publish a Linux release as supported.
