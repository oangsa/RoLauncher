name: CI and release

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**', 'codex/**', 'hotfix/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check development, recovery, governance and isolated hotfix branch flow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/branch-flow.py

  windows-checks:
    name: Windows checks
    needs: branch-flow
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.99.0
      - name: Check version and release notes
        run: python scripts/check-release.py
      - name: Rust, desktop and GPUI smoke tests
        timeout-minutes: 25
        run: ./scripts/test.ps1
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Test isolated installer and update handoff
        run: ./scripts/test-installer.ps1
      - name: Package executable installer, portable app and corresponding source
        run: ./scripts/package.ps1 -UseCurrentVersion
      - name: Verify packaged files and published desktop
        run: python scripts/verify-package.py --smoke-shell
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-attempt-${{ github.run_attempt }}
          path: |
            dist/rolauncher-v*-setup-x64.exe
            dist/rolauncher-v*-windows-x64.zip
            dist/rolauncher-v*-source.zip
            dist/rolauncher-v*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            target/ui-preview/*.txt
            target/ui-preview/*.png
            target/ui-bridge/*.txt

